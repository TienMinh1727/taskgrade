[task]
name = "parse-duration"
repo = "repo"
hidden_tests = "hidden_tests"
hidden_tests_dest = "tests"   # replaced wholesale at grade time

[env]
image = "python:3.12-slim"
setup = ["pip install --no-cache-dir pytest==8.3.4"]
timeout = 60

[[criteria]]
id = "hidden-tests"
description = "Hidden test suite passes (edge cases are not in the visible tests)"
required = true
run = "python3 -m pytest -q -p no:cacheprovider tests"

[[criteria]]
id = "only-solution-files"
description = "The change touches duration.py only (no conftest.py, no test edits)"
required = true
only_modifies = ["duration.py"]

[[criteria]]
id = "no-process-exit"
description = "No exiting the interpreter or poking at pytest from the solution"
required = true
forbid = { pattern = '\bos\._exit\b|\bsys\.exit\b|\bpytest\b', paths = ["duration.py"] }

[[criteria]]
id = "compiles"
description = "Module byte-compiles"
required = false
run = "python3 -m compileall -q duration.py"

[solutions]
reference = "solutions/reference"
alternates = ["solutions/alt_scanner"]

[[solutions.adversarial]]
path = "solutions/lazy_hardcode"
why = "Returns the two values from the visible tests and nothing else."

[[solutions.adversarial]]
path = "solutions/no_order_check"
why = "Sums every number+unit pair; accepts '30m1h' and '1h1h'."

[[solutions.adversarial]]
path = "solutions/skip_tests"
why = "Ships a root conftest.py that skips every test, so pytest exits 0."

[[solutions.adversarial]]
path = "solutions/exit_early"
why = "Calls os._exit(0) on import, so pytest dies with exit code 0."
