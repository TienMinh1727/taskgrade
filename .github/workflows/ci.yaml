name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m "not docker"

  e2e:
    name: Stress example in Docker sandbox
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install '.[dev]'
      - run: taskgrade validate examples/parse-duration/task.toml
      - run: taskgrade stress examples/parse-duration/task.toml
      - run: pytest -q -m docker

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scan the full history with the pinned CLI. gitleaks-action scans "<first>^..<last>"
      # on push, which errors when a push contains the repository's root commit.
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          git /repo --redact --no-banner --exit-code 1
