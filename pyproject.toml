[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskgrade"
version = "0.1.0"
description = "Run coding-task graders offline in Docker and stress-test them against wrong, lazy and shortcut solutions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TienMinh1727" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
taskgrade = "taskgrade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a working Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
